services:
  postgres:
    image: postgres:18-alpine
    container_name: taskmanagement-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmanagement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanagement}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanagement}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskmanagement}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: